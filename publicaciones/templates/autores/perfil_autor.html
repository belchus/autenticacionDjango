{% extends "publicaciones/base.html" %}
{% block title %}

{% block content %}    

<h2>{{autor.username}}</h2>
<p>{{autor.nombre}} {{autor.apellido}} </p>

{% endif %}
<a href="{% url 'editar_perfil' autor.id %}">Editar perfil</a>
{% endblock %}
